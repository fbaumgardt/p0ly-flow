# p0ly-flow smoke-test configuration (US-024)
#
# Runs the full DAG against the synthetic dmss-marked fixture produced by
# `scripts/create_fixture.py` — the repo's only marker-complete recording.
#
#   uv run --with pybv python scripts/create_fixture.py   # once, or after --seed changes
#   uv run snakemake -n --configfile config.test.yaml     # DAG check
#   uv run snakemake -c1 --configfile config.test.yaml    # full smoke run (<60 s)
#
# Differences from config.yaml are deliberate and limited to:
#   * task / experiment_spec / manifest  -> the dmss fixture
#   * ica_strategy: null                 -> ICLabel on synthetic noise is slow and
#                                           meaningless; ICA has its own tests
#   * output_directory                   -> keeps smoke artifacts out of real runs
#   * analysis.run_erp: true             -> exercises the US-010 ERP rules end-to-end
#                                          (grand averages; cluster permutation
#                                          contrasts need >= 2 subjects)
#   * analysis.run_psd: true             -> exercises the US-011 PSD rules
#                                          end-to-end (no n >= 2 gating —
#                                          no statistics in this module)
#   * analysis.run_tfr: true             -> exercises the US-012 TFR rules
#                                          end-to-end (power + ITPC +
#                                          difference map; no n >= 2 gating)
#   * analysis.run_variability: true     -> exercises the US-029 variability
#                                          rules end-to-end (voltage SD +
#                                          power SD/Fano/CV; no n >= 2 gating)
#   * analysis.run_regression: true      -> exercises the US-014 regression
#                                          rules end-to-end (per-subject OLS
#                                          beta maps + equal-weight cohort
#                                          mean; no statistics)
#   * analysis.run_cfc: true             -> exercises the US-027 CFC rules
#                                          end-to-end (subject nulls +
#                                          descriptive mean + subject-unit
#                                          contrast; small surrogate counts)
# Everything else mirrors config.yaml so the smoke run exercises the real chain.

project_settings:
  experiment_name: "p0ly_smoke"
  input_format: "BrainVision"
  data_directory: "data/raw/"
  output_directory: "data/derivatives_test/"
  task: "dmss"
  montage: "easycap-M1"

subjects:
  - "001"
  - "002"

ingestion:
  manifest: "metadata/manifest.test.tsv"

preprocessing:
  l_freq: 1.0
  h_freq: 100.0
  bad_channel_z_thresh: 2.5
  interval_reject_z_thresh: 3.0
  interval_window_ms: 500
  ica_strategy: null # smoke run: no ICLabel on synthetic noise (see header)
  icalabel_threshold: 0.75
  ica_fit_window: null

epoching:
  intervals:
    stim: [-0.2, 1.2]
    prob: [-0.2, 1.2]
    fdb: [-0.2, 1.0]
    resp: [-1.2, 0.2]
  baseline: [-0.2, 0.0]

metadata:
  experiment_spec: "metadata/specs/dmss.yaml"
  csv_columns: null
  expand_trials: false

group_aggregation:
  cohort_file: "data/metadata/participants.test.tsv"
  # Cohorts must exist in cohort_file (parse-time fail loud, US-015).
  aggregate_by_cohorts: ["control", "all_combined"]
  condition_splits:
    correct_trials: "Correct == True"
    incorrect_trials: "Correct == False"

erp:
  # US-010: statistics for the run_erp rule (cluster permutation contrasts).
  # n_permutations caps the sign-flip permutation count — with n subjects MNE
  # uses min(n_permutations, 2 ** (n_subjects - 1)) unique permutations, so
  # small cohorts quantize p-values (min p = 1 / n_unique). seed makes the
  # permutation draw reproducible; null re-randomizes every run.
  n_permutations: 1024
  seed: 20261020

psd:
  # US-011: Welch + parameterization settings for the run_psd rule (read when
  # analysis.run_psd is true). Spectra are computed per (subject, timelock,
  # condition); bands are inclusive (fmin, fmax) Hz windows on the Welch grid;
  # relative power is each band's fraction of the mass within norm_range.
  fmin: 1.0
  fmax: 45.0
  n_fft: 256       # 1 s window at 256 Hz -> 1 Hz bins
  bands:
    theta: [4, 8]
    alpha: [8, 12]
    beta: [12, 30]
    gamma: [30, 45]
  norm_range: [1, 45]

tfr:
  # US-012: TFR settings (see config.yaml for the full key documentation).
  # Same grid as config.yaml — the smoke run exercises the real analysis
  # settings end-to-end.
  method: "morlet"
  fmin: 4.0
  fmax: 45.0
  step: 1.0
  n_cycles: null
  time_bandwidth: 4.0
  decim: 4
  # US-026 cluster-permutation statistics (same semantics as the erp block).
  n_permutations: 128
  seed: 20261020

regression:
  # US-014: single-trial OLS predictors (see config.yaml for the full key
  # documentation). The smoke run exercises the real voltage-domain design
  # end-to-end with one continuous + one categorical predictor. `Onset`
  # stands in for `RT` because the synthetic fixture's probe->response
  # interval is constant (every RT == 0.300781 s), which the library
  # correctly rejects as a rank-deficient design.
  signal_domain: voltage
  continuous: [Onset]
  categorical: [Correct]

connectivity:
  # US-013: connectivity settings (see config.yaml for the full key
  # documentation). Same grid/threshold as config.yaml — the smoke run
  # exercises the real analysis settings end-to-end.
  methods: ["wpli", "coh", "plv"]
  fmin: 4.0
  fmax: 45.0
  mode: "multitaper"
  n_jobs: 1
  fisher_z_average: false
  min_edge_weight: 0.1
  bands:
    theta: [4, 8]
    alpha: [8, 12]
    beta: [12, 30]
    gamma: [30, 45]

cfc:
  # US-027: CFC settings (see config.yaml for the full key documentation).
  # Coarser grids and small surrogate/permutation counts than config.yaml so
  # the smoke run stays seconds-fast (the full subject null is archived, so
  # its size scales with n_surrogates).
  methods: [pac, phase_phase]
  pac_method: gaussian_copula
  # Grids must leave at least one cell per configured ratio within
  # ratio_tolerance: 2:1 -> (4->8), (8->16); 3:1 -> (8->24).
  phase_freqs:
    fmin: 4.0
    fmax: 8.0
    step: 4.0
    bandwidth: 2.0
  amp_freqs:
    fmin: 8.0
    fmax: 24.0
    step: 8.0
    bandwidth: 4.0
  ratios: [[2, 1], [3, 1]]
  ratio_tolerance: 0.5
  n_surrogates: 12
  n_permutations: 64
  seed: 20261020
  n_jobs: 1

variability:
  # US-029: both domains (see config.yaml for the full key documentation).
  # The power domain reuses the tfr: block above, independently of
  # analysis.run_tfr.
  voltage:
    measures: [sd]
  power:
    measures: [sd, fano, cv]

analysis:
  run_erp: true
  run_psd: true
  run_tfr: true
  run_connectivity: true
  run_regression: true
  run_cfc: true
  run_variability: true
  run_decoding: false
