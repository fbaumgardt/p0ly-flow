[project]
name = "p0ly-flow"
version = "0.1.0"
description = "Snakemake orchestration pipeline for p0ly EEG analysis"
readme = "README.md"
authors = [
    { name = "Frederik Baumgardt", email = "fbaumgardt@posteo.de" }
]
requires-python = ">=3.13"
dependencies = [
    "h5io>=0.2.5",
    "p0ly-eeg",
    "snakemake>=9.0",
    # US-027: the CFC rules call p0ly_eeg.analysis.cfc, whose PAC path
    # imports tensorpac. Pinned to the story-verified version so the flow
    # runtime env carries it whether or not the path dep resolves first.
    "tensorpac==0.6.5",
]

[tool.uv]
package = false

[tool.uv.sources]
p0ly-eeg = { path = "../p0ly-eeg", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.14",
]

[tool.ruff]
target-version = "py313"
src = ["scripts"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["F821"]
