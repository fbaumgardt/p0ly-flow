# p0ly-flow configuration
# Anchors: SCHEMA.md §4

project_settings:
  experiment_name: "p0ly_bootstrap"
  input_format: "BrainVision" # BrainVision | BIDS
  data_directory: "data/raw/" # BV: root with sub-{id}/ dirs; BIDS: BIDS dataset root
  output_directory: "data/derivatives/"
  task: "rest" # task label: embedded in BV filenames + BIDS entity; null = no task axis (manifest catalogues every recording)
  montage: "easycap-M1" # MNE builtin montage applied on ingestion when the recording lacks one; null = never apply

subjects:
  - "001" # Bootstrap: single placeholder subject (bare ID)

ingestion:
  # SCHEMA §4 / ADR-005 §3 amendment (US-009): manifest-driven multi-segment
  # ingestion. One row per recording segment; the merge_recordings rule
  # concatenates a subject's segments (N >= 1) into a single desc-raw FIF.
  # Hand-authored for the bootstrap; regenerate via `scripts/create_tsv.py`.
  manifest: "metadata/manifest.tsv"

preprocessing:
  # All keys optional — omit a key to skip that step (see SCHEMA §preprocessing / ADR-004).
  l_freq: 1.0
  h_freq: 100.0
  bad_channel_z_thresh: 2.5
  interval_reject_z_thresh: 3.0
  interval_window_ms: 500
  ica_strategy: "mne-icalabel" # find_bads_eog | mne-icalabel
  icalabel_threshold: 0.75 # sliding-window peak-to-peak Z-score (SCHEMA §preprocessing)
  ica_fit_window: null # null = full recording; float = centred N-seconds window; [tmin, tmax] = explicit window (SCHEMA §preprocessing). Crop is fit-only — the cleaned output spans the full recording.

epoching:
  # Per-timelock (tmin, tmax) epoch windows — analysis-run config (ADR-006).
  # The spec (metadata.experiment_spec) owns the timelock event-code map only;
  # keys here MUST match the spec's timelock keys (validate_intervals errors on
  # a config-side typo, warns if the spec declares a timelock not run here).
  intervals:
    stim: [-0.2, 1.2]
    prob: [-0.2, 1.2]
    fdb: [-0.2, 1.0]
    resp: [-1.2, 0.2]
  # Shared baseline window (seconds) across timelocks.
  baseline: [-0.2, 0.0]

metadata:
  # SCHEMA §4: path to the experiment metadata YAML spec. Specs live in
  # metadata/specs/{experiment}.yaml.
  experiment_spec: "metadata/specs/dmss.yaml"
  # Optional companion CSV aligned positionally to trials (see ExperimentSpec.csv_columns).
  csv_columns: null
  # One row per selection for experiments with ExperimentSpec.trial_expander (e.g. IGT).
  expand_trials: false

group_aggregation:
  cohort_file: "data/metadata/participants.tsv"
  # Cohorts to expand the {cohort} wildcard over. Every declared label must
  # have participants in cohort_file (parse-time fail loud, US-015) — add a
  # cohort here only after its participants are entered in participants.tsv.
  # `all_combined` is reserved: it aggregates every participant in the file.
  aggregate_by_cohorts: ["control", "all_combined"]
  condition_splits:
    correct_trials: "Correct == True"
    incorrect_trials: "Correct == False"

erp:
  # US-010: statistics for the run_erp rule (cluster permutation contrasts).
  # n_permutations caps the sign-flip permutation count — with n subjects MNE
  # uses min(n_permutations, 2 ** (n_subjects - 1)) unique permutations, so
  # small cohorts quantize p-values (min p = 1 / n_unique). seed makes the
  # permutation draw reproducible; null re-randomizes every run.
  n_permutations: 1024
  seed: 20261020

psd:
  # US-011: Welch + parameterization settings for the run_psd rule (read when
  # analysis.run_psd is true). Spectra are computed per (subject, timelock,
  # condition); bands are inclusive (fmin, fmax) Hz windows on the Welch grid;
  # relative power is each band's fraction of the mass within norm_range.
  fmin: 1.0
  fmax: 45.0
  n_fft: 256       # 1 s window at 256 Hz -> 1 Hz bins
  bands:
    theta: [4, 8]
    alpha: [8, 12]
    beta: [12, 30]
    gamma: [30, 45]
  norm_range: [1, 45]

tfr:
  # US-012: Morlet/multitaper TFR power + ITPC for the tfr_subject /
  # tfr_group_average / run_tfr rules (read when analysis.run_tfr is true).
  # method: "morlet" | "multitaper" (time_bandwidth applies to multitaper
  # only); the inclusive [fmin, fmax] grid is built with step; n_cycles null
  # = adaptive freqs/2 (time resolution scales with frequency), float =
  # fixed cycle count; decim shrinks the persisted time axis (the
  # full-rate transient is computed regardless — artifact-size lever).
  # No baseline key: the epochs already carry the time-domain baseline
  # (display-scale baselining is a documented non-goal).
  method: "morlet"
  fmin: 4.0
  fmax: 45.0
  step: 1.0
  n_cycles: null # null = adaptive freqs/2; float = fixed cycles
  time_bandwidth: 4.0 # multitaper only (ignored for morlet)
  decim: 4 # 1.4 s epoch @ 256 Hz -> ~90 persisted time samples
  # US-026: cluster-permutation statistics for the run_tfr_cluster rule —
  # one-sample test over per-subject difference grids, so with n subjects
  # MNE uses min(n_permutations, 2 ** (n_subjects - 1)) unique permutations.
  # Raw power difference; ITPC is Fisher-z-transformed before differencing
  # (see SCHEMA §9). Same quantization/seed semantics as the erp block.
  n_permutations: 1024
  seed: 20261020

variability:
  # US-029: across-trial variability for the variability_subject /
  # run_variability rules (read when analysis.run_variability is true).
  # A domain key enables that domain; omit it to disable it. At least one
  # domain is required when the toggle is on. Voltage is signed and supports
  # SD only — Fano/CV describe relative dispersion of nonnegative quantities
  # and fail loud on voltage. The power domain reuses the tfr: block above
  # (fmin/fmax/step/method/n_cycles/decim) independently of analysis.run_tfr.
  # Sample estimators (ddof=1) need >= 2 trials per condition; SD comes from
  # the sample variance, Fano = var/mean and CV = sd/mean are defined only
  # where mean power > 0 (other cells stay NaN and are flagged per cell).
  voltage:
    measures: [sd]
  power:
    measures: [sd, fano, cv]

decoding:
  # US-030: within-subject MVPA for the decoding_subject / run_decoding rules
  # (read when analysis.run_decoding is true). `targets` are categorical
  # Epochs.metadata columns; the set is restricted to
  # [A-Za-z_][A-Za-z0-9_]* at DAG-parse time (target names are filename
  # components). Every distinct value is a class; each class needs at least
  # n_splits trials, otherwise the rule fails loud. mode: time_resolved
  # (scores (n_times,)) | temporal_generalization (scores
  # (n_train_times, n_test_times)). estimator is logistic_regression only;
  # estimator_params allows C / max_iter / class_weight. scoring: accuracy |
  # balanced_accuracy (chance = 1 / n_classes for both). seed makes the
  # stratified fold shuffle and classifier resampling reproducible. n_jobs
  # parallelizes across time points only (scores do not depend on it).
  targets: [Correct]
  mode: time_resolved
  estimator: logistic_regression
  estimator_params:
    C: 1.0
    max_iter: 1000
    class_weight: null
  n_splits: 5
  scoring: accuracy
  seed: 20261020
  n_jobs: 1

connectivity:
  # US-013: spectral connectivity for the connectivity_subject /
  # connectivity_group_average / run_connectivity rules (read when
  # analysis.run_connectivity is true). One mne-connectivity call computes
  # every method; each adjacency comes back (n_channels, n_channels,
  # n_freqs), symmetric with a zero diagonal (self-connectivity excluded).
  # run_connectivity graphs are the band-averaged group adjacencies:
  # min_edge_weight drops weak couplings (noise-floor lever — a thresholded
  # functional graph must NOT be complete); path length uses the effective
  # distance 1/weight on the largest connected component. Bands are
  # inclusive (fmin, fmax) Hz windows; module-local (not psd.bands) so the
  # PSD section stays free to change its grid.
  methods: ["wpli", "coh", "plv"]
  fmin: 4.0
  fmax: 45.0
  # Spectral estimation mode forwarded to mne-connectivity (US-013 deferral);
  # n_jobs is the parallelism lever for the per-subject spectral step.
  mode: "multitaper"
  n_jobs: 1
  # Fisher-z before cross-subject averaging (US-013 deferral). false keeps
  # the plain arithmetic mean (historical outputs); true averages in
  # arctanh space (with the US-026 ceiling clip) and tanh-transforms back.
  fisher_z_average: false
  min_edge_weight: 0.1
  bands:
    theta: [4, 8]
    alpha: [8, 12]
    beta: [12, 30]
    gamma: [30, 45]

regression:
  # US-014: single-trial OLS predictors for the regression_subject /
  # run_regression rules (read when analysis.run_regression is true). One
  # model per (subject, timelock) is fit on ALL retained trials: intercept
  # + every `continuous` column (numeric, never standardized — beta units
  # are response units per predictor unit) + every `categorical` column
  # reference-coded against its lexicographically first level (`column[level]`
  # dummy terms, betas are differences from that reference). At least one of
  # the two lists must be non-empty when enabled; rows with a null/non-finite
  # predictor are excluded and counted in the artifact. Explanatory
  # within-subject estimation only — no decoding, no contrasts/inference.
  signal_domain: voltage # voltage (epochs.get_data()) | power (per-epoch TFR power)
  continuous: [RT] # numeric metadata columns; may be []
  categorical: [Correct] # reference-coded metadata columns; may be []
  # signal_domain: power reuses the `tfr:` block above for the transform
  # (fmin/fmax/step/method/n_cycles/time_bandwidth/decim) even when
  # analysis.run_tfr is false; no log power is applied.
cfc:
  # US-027: within-channel cross-frequency coupling for the cfc_subject /
  # cfc_group_average / run_cfc rules (read when analysis.run_cfc is true).
  # methods: pac (tensorpac) + phase_phase (Hilbert n:m); phase_freqs /
  # amp_freqs declare CENTER grids (built into the inclusive [fmin, fmax]
  # grid with step, via freq_grid), and the bandwidths are FULL band widths:
  # every filter band is [f - bandwidth/2, f + bandwidth/2]. Guarded at
  # runtime: strictly increasing grids with >= 2 bins, positive widths, every
  # low edge > 0 Hz and every high edge < sfreq/2.
  methods: [pac, phase_phase]
  pac_method: gaussian_copula   # gaussian_copula | mean_vector_length (probe-verified)
  phase_freqs:
    fmin: 4.0
    fmax: 12.0
    step: 2.0
    bandwidth: 2.0              # full width, Hz
  amp_freqs:
    fmin: 20.0
    fmax: 45.0
    step: 5.0
    bandwidth: 4.0              # full width, Hz
  ratios: [[2, 1], [3, 1]]      # f_amp / f_phase = n / m (positive, coprime)
  ratio_tolerance: 0.5          # absolute Hz; off-ratio PPC cells = NaN
  # Subject nulls are retained in full (n_surrogates x n_channels x n_phase x
  # n_amp) — that array IS the subject-level evidence, so archive size grows
  # linearly with this count. Cohort contrasts do NOT use it.
  n_surrogates: 200
  # Cohort sign flips: exact when 2 ** (n_subjects - 1) <= n_permutations,
  # else this many seeded random patterns (observed all-+ always included).
  # Full-map max-|statistic| correction, one family per method.
  n_permutations: 1024
  seed: 20261020
  n_jobs: 1

analysis:
  run_erp: false
  run_psd: false
  run_tfr: false
  run_connectivity: false
  run_variability: false
  run_cfc: false
  run_regression: false
  run_decoding: false
